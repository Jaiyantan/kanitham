services:
  postgres:
    image: postgres:16-alpine
    container_name: kanitham-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: kanitham_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart-packaging-hub-schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

volumes:
  postgres_data:

